name: E2E

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  onboarding-e2e:
    name: Onboarding → session e2e
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install native build toolchain and virtual display
        run: |
          echo "\$nrconf{restart} = 'a';" | sudo tee -a /etc/needrestart/needrestart.conf > /dev/null
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y python3 make g++ xvfb

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.4
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
        working-directory: e2e

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      # On a cache hit the chromium binary is already restored, so we only need
      # the apt system libraries (install-deps). On a miss we download both.
      - name: Install Playwright browser (chromium) and system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --dir e2e exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cached browser)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --dir e2e exec playwright install-deps chromium

      - name: Run onboarding e2e
        # The Playwright config boots the backend + Angular dev servers itself.
        # The electron project launches a real desktop shell, which needs a
        # display; xvfb provides one (headless chromium is unaffected).
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" pnpm --dir e2e test

      - name: Upload end-screen screenshot
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-end-screen
          path: e2e/artifacts/end-screen.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Add end-screen screenshot to job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f e2e/artifacts/end-screen.png ]; then
            {
              echo "## E2E end screen"
              echo ""
              echo "Final state after onboarding → project → worktree → session."
              echo "Download the \`e2e-end-screen\` artifact above to view it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright traces and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14
