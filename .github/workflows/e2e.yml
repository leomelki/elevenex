name: E2E

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  onboarding-e2e:
    name: Onboarding → session e2e
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install native build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make g++

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.4
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (chromium)
        run: pnpm --dir e2e exec playwright install --with-deps chromium

      - name: Run onboarding e2e
        # The Playwright config boots the backend + Angular dev servers itself.
        run: pnpm --dir e2e test

      - name: Upload end-screen screenshot
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-end-screen
          path: e2e/artifacts/end-screen.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Add end-screen screenshot to job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f e2e/artifacts/end-screen.png ]; then
            {
              echo "## E2E end screen"
              echo ""
              echo "Final state after onboarding → project → worktree → session."
              echo "Download the \`e2e-end-screen\` artifact above to view it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright traces and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14
