name: Build and release assets
run-name: "${{ inputs.pull_request && format('PR #{0} preview', inputs.pull_request) || 'Release assets' }} — @${{ github.actor }}"

on:
  push:
    branches: [main, master, feat/new-ui]
    paths:
      - 'apps/backend/**'
      - 'apps/desktop/**'
      - 'apps/renderer/**'
      - 'apps/frontend/proxy.conf.json'
      - 'apps/electron/remote-server-utils.cjs'
      - 'packages/**'
      - 'scripts/**'
      - 'docs/design-system/project/tokens.css'
      - 'elevenex-logo.svg'
      - 'tsconfig.desktop.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/scripts/**'
      - '.github/workflows/release-assets.yml'
      - '.github/workflows/reusable-build-*.yml'
  workflow_dispatch:
    inputs:
      pull_request:
        description: 'PR number to release (blank builds the selected branch)'
        type: string
        default: ''
      head_sha:
        description: 'Expected PR head SHA (set automatically by the preview label)'
        type: string
        default: ''
      requested_by:
        description: 'Label requester (set automatically)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-assets-${{ inputs.pull_request || github.sha }}-${{ inputs.head_sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release commit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
      pr: ${{ steps.plan.outputs.pr }}
    steps:
      # Use the workflow's trusted revision for orchestration, never PR scripts.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - name: Test release orchestration and runtime selection
        run: node --test .github/scripts/*.test.cjs
      - id: plan
        uses: actions/github-script@v7
        env:
          RELEASE_PR: ${{ inputs.pull_request }}
          RELEASE_HEAD_SHA: ${{ inputs.head_sha }}
          RELEASE_REQUESTER: ${{ inputs.requested_by }}
        with:
          script: |
            await require('./.github/scripts/resolve-release.cjs')({ github, context, core });

  build-runtime:
    needs: prepare
    name: Build runtime assets
    uses: ./.github/workflows/reusable-build-runtime.yml
    with:
      source-sha: ${{ needs.prepare.outputs.sha }}
      release-signing: ${{ needs.prepare.outputs.tag != '' }}
    secrets:
      APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_ID_EMAIL: ${{ secrets.APPLE_ID_EMAIL }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  build-desktop:
    needs: prepare
    name: Build desktop installers
    uses: ./.github/workflows/reusable-build-desktop.yml
    with:
      source-sha: ${{ needs.prepare.outputs.sha }}
      release-tag: ${{ needs.prepare.outputs.tag }}
    secrets:
      APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_ID_EMAIL: ${{ secrets.APPLE_ID_EMAIL }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

  release:
    name: Publish release assets
    needs:
      - prepare
      - build-runtime
      - build-desktop
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-runtime-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: elevenex-*
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts/

      - name: Validate assets and write manifest
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_PR: ${{ needs.prepare.outputs.pr }}
        run: node .github/scripts/write-release-manifest.cjs artifacts

      - name: Write release notes
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_PR: ${{ needs.prepare.outputs.pr }}
        # Written outside artifacts/ so it is not uploaded as a release asset.
        run: node .github/scripts/write-release-notes.cjs artifacts "$RUNNER_TEMP/release-notes.md"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          make_latest: false
          name: "${{ needs.prepare.outputs.pr && format('PR #{0} preview', needs.prepare.outputs.pr) || 'Release assets' }} ${{ needs.prepare.outputs.sha }}"
          prerelease: true
          files: artifacts/*
          fail_on_unmatched_files: true
          body_path: ${{ runner.temp }}/release-notes.md

      - name: Link release in workflow summary
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: echo "Release downloads — https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
