name: Build and release assets
run-name: "${{ inputs.pull_request && format('PR #{0} preview', inputs.pull_request) || 'Release assets' }} — @${{ github.actor }}"

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/backend/**'
      - 'apps/electron/**'
      - 'apps/frontend/**'
      - 'apps/frontend/proxy.conf.json'
      - 'vscode-filesystem-provider/**'
      - 'vscode-scm-extension/**'
      - 'scripts/stage-remote-runtime.js'
      - 'scripts/stage-electron-backend.js'
      - 'scripts/prepare-vscode-web-runtime.js'
      - 'scripts/bundle-electron-backend.js'
      - 'scripts/rebuild-electron-backend-natives.js'
      - 'scripts/archive-electron-backend.js'
      - 'scripts/stage-version.js'
      - 'scripts/collect-source-maps.js'
      - 'package.json'
      - '.github/scripts/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/release-assets.yml'
      - '.github/workflows/reusable-build-runtime.yml'
      - '.github/workflows/reusable-build-macos-desktop.yml'
      - '.github/workflows/reusable-build-linux-desktop.yml'
      - '.github/workflows/reusable-build-windows-desktop.yml'
  workflow_dispatch:
    inputs:
      pull_request:
        description: 'PR number to release (blank builds the selected branch)'
        type: string
        default: ''
      head_sha:
        description: 'Expected PR head SHA (set automatically by the preview label)'
        type: string
        default: ''
      requested_by:
        description: 'Label requester (set automatically)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-assets-${{ inputs.pull_request || github.ref }}-${{ inputs.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release commit
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
      pr: ${{ steps.plan.outputs.pr }}
    steps:
      # Use the workflow's trusted revision for orchestration, never PR scripts.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test release orchestration and runtime selection
        run: node --test .github/scripts/*.test.cjs apps/electron/test/runtime-release.test.cjs apps/electron/test/app-updater-channel.test.cjs apps/electron/test/app-updater.test.cjs apps/electron/test/package-files.test.cjs
      - id: plan
        uses: actions/github-script@v7
        env:
          RELEASE_PR: ${{ inputs.pull_request }}
          RELEASE_HEAD_SHA: ${{ inputs.head_sha }}
          RELEASE_REQUESTER: ${{ inputs.requested_by }}
        with:
          script: |
            await require('./.github/scripts/resolve-release.cjs')({ github, context, core });

  build-runtime:
    needs: prepare
    name: Build runtime assets
    uses: ./.github/workflows/reusable-build-runtime.yml
    with:
      source-sha: ${{ needs.prepare.outputs.sha }}
      release-tag: ${{ needs.prepare.outputs.tag }}

  build-macos-dmg:
    needs: prepare
    name: Build macOS desktop asset
    uses: ./.github/workflows/reusable-build-macos-desktop.yml
    with:
      source-sha: ${{ needs.prepare.outputs.sha }}
      release-tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit

  build-linux-desktop:
    needs: prepare
    name: Build Linux desktop assets
    uses: ./.github/workflows/reusable-build-linux-desktop.yml
    with:
      source-sha: ${{ needs.prepare.outputs.sha }}
      release-tag: ${{ needs.prepare.outputs.tag }}

  build-windows-desktop:
    needs: prepare
    name: Build Windows desktop asset
    uses: ./.github/workflows/reusable-build-windows-desktop.yml
    with:
      source-sha: ${{ needs.prepare.outputs.sha }}
      release-tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit

  release:
    name: Publish release assets
    needs:
      - prepare
      - build-runtime
      - build-macos-dmg
      - build-linux-desktop
      - build-windows-desktop
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts/

      - name: Validate assets and write manifest
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_PR: ${{ needs.prepare.outputs.pr }}
        run: node .github/scripts/write-release-manifest.cjs artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          make_latest: false
          name: "${{ needs.prepare.outputs.pr && format('PR #{0} preview', needs.prepare.outputs.pr) || 'Release assets' }} ${{ needs.prepare.outputs.sha }}"
          prerelease: true
          files: artifacts/*
          fail_on_unmatched_files: true
          body: |
            Auto-built release assets for commit `${{ needs.prepare.outputs.sha }}`.
            Includes remote runtime tarballs downloaded during SSH setup,
            local desktop runtime tarballs downloaded by packaged desktop apps,
            plus macOS, Linux, and Windows desktop artifacts.

      - name: Link release in workflow summary
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: echo "Release downloads — https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
