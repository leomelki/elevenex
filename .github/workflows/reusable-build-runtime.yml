name: Reusable runtime build

on:
  workflow_call:
    inputs:
      source-sha:
        description: Exact commit to build
        type: string
        required: true

permissions:
  contents: read

# GITHUB_SHA describes the caller; generated build info must describe the checkout.
env:
  GIT_SHA: ${{ inputs.source-sha }}
  # CPU bindings remain installed. Skip the optional CUDA libraries.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  build-runtime:
    name: Build ${{ matrix.target }} runtimes
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            desktop-target: linux-x64
            runner: ubuntu-22.04
            extension: tar.gz
          - target: linux-arm64
            desktop-target: linux-arm64
            runner: ubuntu-22.04-arm
            extension: tar.gz
          - target: darwin-arm64
            desktop-target: macos-arm64
            runner: macos-15
            extension: tar.gz
          - target: win32-x64
            desktop-target: windows-x64
            runner: windows-2022
            extension: zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: pnpm

      - name: Install native build toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y python3 make g++

      - name: Set up Docker Buildx for portable Linux backends
        if: runner.os == 'Linux'
        uses: docker/setup-buildx-action@v3

      - name: Install runtime build dependencies
        run: pnpm --filter elevenex-backend... install --frozen-lockfile

      - name: Verify signed macOS app capture helper and H.264 bitstream
        if: runner.os == 'macOS'
        run: node scripts/test-task-app-macos.cjs

      - name: Build backend and portable Node archive
        run: pnpm desktop:backend

      - name: Verify Windows private IPC, packaged app job and desktop capture
        if: runner.os == 'Windows'
        run: |
          pnpm --dir apps/backend exec jest --runInBand --runTestsByPath src/config/windows-desktop-pipe.spec.ts
          node scripts/test-task-app-windows.cjs dist-runtime/elevenex-backend-windows-x64.tar.gz

      # Existing SSH consumers use this archive layout and launcher.
      - name: Build SSH runtime
        env:
          TARGET: ${{ matrix.target }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          node scripts/stage-remote-runtime.js "--target=$TARGET"
          mkdir -p ssh-runtime
          archive="elevenex-remote-runtime-$TARGET.$EXTENSION"
          cp "apps/electron/.stage/remote-runtime/$TARGET.$EXTENSION" "ssh-runtime/$archive"
          node .github/scripts/stage-release-assets.cjs dist-runtime "ssh-runtime/$archive"

      - uses: actions/upload-artifact@v4
        with:
          name: elevenex-runtimes-${{ matrix.target }}
          path: |
            dist-runtime/elevenex-backend-${{ matrix.desktop-target }}.tar.gz*
            dist-runtime/elevenex-remote-runtime-${{ matrix.target }}.${{ matrix.extension }}*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
