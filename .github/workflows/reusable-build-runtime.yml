name: Reusable runtime build

on:
  workflow_call:

jobs:
  build-runtime:
    name: Build ${{ matrix.target }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runs-on: ubuntu-22.04
            checksum-command: sha256sum
            archive_extension: tar.gz
          - target: linux-arm64
            runs-on: ubuntu-22.04-arm
            checksum-command: sha256sum
            archive_extension: tar.gz
          - target: darwin-arm64
            runs-on: macos-15
            checksum-command: shasum -a 256
            archive_extension: tar.gz
          - target: win32-x64
            runs-on: windows-2022
            archive_extension: zip
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - name: Install native build toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          echo "\$nrconf{restart} = 'a';" | sudo tee -a /etc/needrestart/needrestart.conf > /dev/null
          sudo apt-get install -y python3 make g++

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.4
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend bundle
        run: pnpm backend:bundle

      - name: Stage remote runtime for ${{ matrix.target }}
        run: node scripts/stage-remote-runtime.js --target=${{ matrix.target }}

      - name: Verify native binaries are present
        if: runner.os != 'Windows'
        run: |
          set -eu
          ROOT="apps/electron/.stage/remote-runtime/${{ matrix.target }}"
          test -f "$ROOT/node_modules/.pnpm/node-pty@"*"/node_modules/node-pty/build/Release/pty.node" \
            || test -f "$ROOT/node_modules/.pnpm/node-pty@"*"/node_modules/node-pty/prebuilds/${{ matrix.target }}/pty.node" \
            || { echo "node-pty native binary missing for ${{ matrix.target }}"; exit 1; }
          test -f "$ROOT/node_modules/.pnpm/better-sqlite3@"*"/node_modules/better-sqlite3/build/Release/better_sqlite3.node" \
            || { echo "better-sqlite3 native binary missing for ${{ matrix.target }}"; exit 1; }

      - name: Verify native binaries are present
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'apps/electron/.stage/remote-runtime/${{ matrix.target }}'
          $pty = Get-ChildItem "$root/node_modules/.pnpm" -Recurse -File -Filter pty.node |
            Where-Object { $_.FullName -match 'node-pty' } |
            Select-Object -First 1
          if (-not $pty) {
            throw 'node-pty native binary missing for ${{ matrix.target }}'
          }
          $sqlite = Get-ChildItem "$root/node_modules/.pnpm" -Recurse -File -Filter better_sqlite3.node |
            Select-Object -First 1
          if (-not $sqlite) {
            throw 'better-sqlite3 native binary missing for ${{ matrix.target }}'
          }

      - name: Rename archive for release
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist-runtime
          cp "apps/electron/.stage/remote-runtime/${{ matrix.target }}.${{ matrix.archive_extension }}" \
             "dist-runtime/elevenex-remote-runtime-${{ matrix.target }}.${{ matrix.archive_extension }}"
          (cd dist-runtime && ${{ matrix.checksum-command }} "elevenex-remote-runtime-${{ matrix.target }}.${{ matrix.archive_extension }}" \
            > "elevenex-remote-runtime-${{ matrix.target }}.${{ matrix.archive_extension }}.sha256")
          ls -lh dist-runtime/

      - name: Rename archive for release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist-runtime | Out-Null
          $archiveName = 'elevenex-remote-runtime-${{ matrix.target }}.${{ matrix.archive_extension }}'
          Copy-Item "apps/electron/.stage/remote-runtime/${{ matrix.target }}.${{ matrix.archive_extension }}" "dist-runtime/$archiveName"
          Get-FileHash "dist-runtime/$archiveName" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $archiveName" } |
            Set-Content "dist-runtime/$archiveName.sha256"
          Get-ChildItem dist-runtime | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: elevenex-remote-runtime-${{ matrix.target }}
          path: dist-runtime/*
          if-no-files-found: error
          retention-days: 30
