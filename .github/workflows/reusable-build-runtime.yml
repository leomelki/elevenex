name: Reusable runtime build

on:
  workflow_call:
    inputs:
      source-sha:
        description: Exact commit to build
        type: string
        required: true
      release-signing:
        description: Require Developer ID signing and notarization for the Mac agent
        type: boolean
        default: false
    secrets:
      APPLE_CERT_BASE64:
        required: false
      APPLE_CERT_PASSWORD:
        required: false
      APPLE_ID_EMAIL:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_APP_DISPLAY_PROFILE_BASE64:
        required: false

permissions:
  contents: read

# GITHUB_SHA describes the caller; generated build info must describe the checkout.
env:
  GIT_SHA: ${{ inputs.source-sha }}
  # CPU bindings remain installed. Skip the optional CUDA libraries.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  build-runtime:
    name: Build ${{ matrix.target }} runtimes
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            desktop-target: linux-x64
            runner: ubuntu-22.04
            extension: tar.gz
          - target: linux-arm64
            desktop-target: linux-arm64
            runner: ubuntu-22.04-arm
            extension: tar.gz
          - target: darwin-arm64
            desktop-target: macos-arm64
            runner: macos-15
            extension: tar.gz
          - target: win32-x64
            desktop-target: windows-x64
            runner: windows-2022
            extension: zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: pnpm

      - name: Install native build toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y python3 make g++

      - name: Set up Docker Buildx for portable Linux backends
        if: runner.os == 'Linux'
        uses: docker/setup-buildx-action@v3

      - name: Install runtime build dependencies
        run: pnpm --filter elevenex-backend... install --frozen-lockfile

      - name: Verify signed macOS app capture helper and H.264 bitstream
        if: runner.os == 'macOS'
        run: |
          node --test scripts/task-app-macos-signing.test.cjs
          node --test scripts/task-app-macos-update.test.cjs
          node scripts/test-task-app-macos.cjs

      - name: Prepare Developer ID signing for the public Mac agent
        if: runner.os == 'macOS' && inputs.release-signing
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID_EMAIL: ${{ secrets.APPLE_ID_EMAIL }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_DISPLAY_PROFILE_BASE64: ${{ secrets.APPLE_APP_DISPLAY_PROFILE_BASE64 }}
        run: |
          for key in APPLE_CERT_BASE64 APPLE_CERT_PASSWORD APPLE_ID_EMAIL APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            test -n "${!key}" || { echo "Missing required Mac runtime signing credential: $key"; exit 1; }
          done
          keychain="$RUNNER_TEMP/elevenex-agent-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/elevenex-agent-signing.p12"
          trap 'rm -f "$certificate"' EXIT
          printf '%s' "$APPLE_CERT_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign > /dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          test -n "$identity" || { echo "Developer ID Application certificate is missing"; exit 1; }
          [[ "$identity" == *"($APPLE_TEAM_ID)" ]] || { echo "Developer ID team does not match APPLE_TEAM_ID"; exit 1; }
          xcrun notarytool store-credentials elevenex-agent-runtime --keychain "$keychain" \
            --apple-id "$APPLE_ID_EMAIL" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID"
          echo "ELEVENEX_APP_DISPLAY_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "ELEVENEX_APP_DISPLAY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "ELEVENEX_APP_DISPLAY_NOTARY_PROFILE=elevenex-agent-runtime" >> "$GITHUB_ENV"
          echo "ELEVENEX_APP_DISPLAY_REQUIRE_SIGNING=1" >> "$GITHUB_ENV"
          # Optional until Apple approves persistent capture for the agent App ID.
          if [[ -n "$APPLE_APP_DISPLAY_PROFILE_BASE64" ]]; then
            capture_profile="$RUNNER_TEMP/elevenex-agent.provisionprofile"
            printf '%s' "$APPLE_APP_DISPLAY_PROFILE_BASE64" | base64 --decode > "$capture_profile"
            echo "ELEVENEX_APP_DISPLAY_PERSISTENT_CAPTURE_PROFILE=$capture_profile" >> "$GITHUB_ENV"
          fi

      - name: Build backend and portable Node archive
        run: pnpm desktop:backend

      - name: Verify public Mac agent after archive extraction
        if: runner.os == 'macOS'
        env:
          RELEASE_SIGNING: ${{ inputs.release-signing }}
        run: |
          args=()
          if [[ "$RELEASE_SIGNING" == true ]]; then args+=(--require-notarized); fi
          if [[ -n "${ELEVENEX_APP_DISPLAY_PERSISTENT_CAPTURE_PROFILE:-}" ]]; then args+=(--require-persistent-capture); fi
          node scripts/verify-task-app-macos.cjs dist-runtime/elevenex-backend-macos-arm64.tar.gz "${args[@]}"

      - name: Remove temporary Mac signing keychain
        if: always() && runner.os == 'macOS' && inputs.release-signing
        run: |
          rm -f "$RUNNER_TEMP/elevenex-agent.provisionprofile"
          security delete-keychain "$RUNNER_TEMP/elevenex-agent-signing.keychain-db" || true

      - name: Verify Windows private IPC, packaged app job and desktop capture
        if: runner.os == 'Windows'
        run: |
          pnpm --dir apps/backend exec jest --runInBand --runTestsByPath src/config/windows-desktop-pipe.spec.ts
          node scripts/test-task-app-windows.cjs dist-runtime/elevenex-backend-windows-x64.tar.gz

      # Existing SSH consumers use this archive layout and launcher.
      - name: Build SSH runtime
        env:
          TARGET: ${{ matrix.target }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          node scripts/stage-remote-runtime.js "--target=$TARGET"
          mkdir -p ssh-runtime
          archive="elevenex-remote-runtime-$TARGET.$EXTENSION"
          cp "apps/electron/.stage/remote-runtime/$TARGET.$EXTENSION" "ssh-runtime/$archive"
          node .github/scripts/stage-release-assets.cjs dist-runtime "ssh-runtime/$archive"

      - uses: actions/upload-artifact@v4
        with:
          name: elevenex-runtimes-${{ matrix.target }}
          path: |
            dist-runtime/elevenex-backend-${{ matrix.desktop-target }}.tar.gz*
            dist-runtime/elevenex-remote-runtime-${{ matrix.target }}.${{ matrix.extension }}*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
