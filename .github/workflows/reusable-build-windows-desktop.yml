name: Reusable Windows desktop build

on:
  workflow_call:
    inputs:
      source-sha:
        description: 'Exact commit to build'
        type: string
        required: true
      release-tag:
        description: 'Release containing the matching runtimes'
        type: string
        required: true

# GITHUB_SHA describes the caller; generated build info must describe the checkout.
env:
  GIT_SHA: ${{ inputs.source-sha }}
  ELEVENEX_RELEASE_TAG: ${{ inputs.release-tag }}
  SOURCE_MAP_RELEASE_TAG: ${{ inputs.release-tag }}

jobs:
  build-windows-desktop:
    name: Build Windows desktop
    permissions:
      contents: read
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.4
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend bundle and Windows runtime tarball
        run: pnpm backend:bundle && pnpm electron:backend:prepare

      - name: Build Windows desktop installer
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm frontend:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm source-maps:collect
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm electron:stage-version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:CSC_LINK) {
            pnpm --dir apps/electron package:win --config.win.signAndEditExecutable=true --config.win.forceCodeSigning=true
          } else {
            pnpm --dir apps/electron package:win
            'Windows installer is unsigned: WINDOWS_CERT_BASE64 is not configured.' >> $env:GITHUB_STEP_SUMMARY
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Windows signature when configured
        env:
          SIGNING_CONFIGURED: ${{ secrets.WINDOWS_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          if ($env:SIGNING_CONFIGURED -ne 'true') { exit 0 }
          $ErrorActionPreference = 'Stop'
          $executables = @(Get-ChildItem apps/electron/dist -File -Filter '*.exe') + @(Get-Item apps/electron/dist/win-unpacked/Elevenex.exe)
          if ($executables.Count -lt 2) { throw 'Installer or app executable missing' }
          foreach ($executable in $executables) {
            $signature = Get-AuthenticodeSignature $executable.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid signature for $($executable.Name): $($signature.Status)" }
          }

      - name: Rename Windows desktop installer for release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist-desktop | Out-Null
          $installer = Get-ChildItem apps/electron/dist -File -Filter '*.exe' |
            Where-Object { $_.Name -notmatch 'blockmap' } |
            Select-Object -First 1
          if (-not $installer) {
            throw 'No Windows installer artifact produced'
          }
          Copy-Item $installer.FullName dist-desktop/elevenex-desktop-windows-x64.exe
          Get-FileHash dist-desktop/elevenex-desktop-windows-x64.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  elevenex-desktop-windows-x64.exe" } |
            Set-Content dist-desktop/elevenex-desktop-windows-x64.exe.sha256
          Get-ChildItem dist-desktop | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: elevenex-desktop-windows-x64
          path: dist-desktop/*
          if-no-files-found: error
          retention-days: 30

      - name: Rename Windows desktop runtime tarball for release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist-runtime | Out-Null
          Copy-Item apps/electron/.stage/backend.tar.gz dist-runtime/elevenex-runtime-windows-x64.tar.gz
          Get-FileHash dist-runtime/elevenex-runtime-windows-x64.tar.gz -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  elevenex-runtime-windows-x64.tar.gz" } |
            Set-Content dist-runtime/elevenex-runtime-windows-x64.tar.gz.sha256
          Get-ChildItem dist-runtime | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: elevenex-runtime-windows-x64
          path: dist-runtime/*
          if-no-files-found: error
          retention-days: 30
