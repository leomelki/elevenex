@if (pending().length > 0) {
  <section class="escalation" role="group" aria-label="Action needed">
    <header class="escalation__header">
      <span class="escalation__icon" aria-hidden="true">
        <ng-icon name="lucideTriangleAlert" size="15" />
      </span>
      <div class="escalation__title">
        <strong>Action needed</strong>
        <span>The agent paused and is waiting for your decision.</span>
      </div>
    </header>

    <ul class="escalation__list">
      @for (approval of pending(); track approval.id) {
        <li class="escalation__item">
          <div class="escalation__copy">
            <span class="escalation__label">{{ approval.label }}</span>
            <p class="escalation__summary">{{ approval.summary }}</p>
          </div>
          <div class="escalation__actions">
            @if (hasTarget(approval.target)) {
              <button
                z-button
                type="button"
                zType="ghost"
                zSize="sm"
                class="escalation__open"
                (click)="open(approval.target)"
              >
                <ng-icon name="lucideArrowUpRight" size="14" />
                Open
              </button>
            }
            <button
              z-button
              type="button"
              zType="outline"
              zSize="sm"
              (click)="decline(approval)"
            >
              <ng-icon name="lucideX" size="14" />
              Decline
            </button>
            <button z-button type="button" zSize="sm" (click)="approve(approval)">
              <ng-icon name="lucideCheck" size="14" />
              Approve
            </button>
          </div>
        </li>
      }
    </ul>
  </section>
}
