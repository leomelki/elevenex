<div class="flex flex-col gap-4">
  <h3 class="text-sm font-semibold text-foreground">Agent settings</h3>

  @if (supportsPermissions()) {
    <fieldset class="min-w-0">
      <legend class="flex items-center gap-1.5 text-xs font-medium text-foreground">
        <ng-icon name="lucideShield" size="13" />
        Permissions
      </legend>
      <div class="flex flex-col gap-1.5">
        @for (option of permissionOptions(); track option.id) {
          <label
            class="flex cursor-pointer items-center gap-3 rounded-lg border border-transparent px-2.5 py-2 transition-colors hover:bg-muted has-checked:border-border has-checked:bg-muted has-focus-visible:ring-2 has-focus-visible:ring-ring"
            [class.text-destructive]="option.id === 'bypassPermissions'"
          >
            <input
              type="radio"
              [name]="permissionGroup"
              class="sr-only"
              [value]="option.id"
              [checked]="permissionMode() === option.id"
              (click)="pickPermissionMode($event, option.id)"
            />
            <span class="min-w-0 flex-1">
              <span class="block text-xs font-medium">{{ option.label }}</span>
              <span class="mt-0.5 block text-[11px] leading-snug text-muted-foreground">{{
                option.hint
              }}</span>
            </span>
            @if (permissionMode() === option.id) {
              <ng-icon name="lucideCheck" size="14" class="shrink-0" aria-hidden="true" />
            }
          </label>
        }
      </div>
    </fieldset>
  }

  @if (supportsFastMode()) {
    <div class="flex items-center justify-between gap-3 border-t border-border pt-3">
      <span>
        <span class="flex items-center gap-1.5 text-xs font-medium text-foreground">
          <ng-icon name="lucideZap" size="13" /> Fast mode
        </span>
        <span class="mt-1 block text-[11px] text-muted-foreground"
          >Faster responses, higher usage.</span
        >
      </span>
      <button
        type="button"
        z-button
        zSize="sm"
        [zType]="fastMode() ? 'secondary' : 'outline'"
        [attr.aria-pressed]="fastMode()"
        aria-label="Fast mode"
        (click)="fastModeChange.emit(!fastMode())"
      >
        {{ fastMode() ? 'On' : 'Off' }}
      </button>
    </div>
  }
  <ng-content select="[conversation-actions]" />
</div>
