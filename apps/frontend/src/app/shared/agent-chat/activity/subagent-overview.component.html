@if (agents().length) {
  <section
    class="mx-auto w-full max-w-[52rem] rounded-xl border-border"
    [class.border]="running().length > 0"
    [class.bg-card]="running().length > 0"
    aria-label="Delegated agents"
  >
    <button
      z-button
      zType="ghost"
      type="button"
      class="h-auto w-full justify-start gap-2.5 px-3 py-2 text-xs text-muted-foreground"
      [class.rounded-b-none]="running().length > 0"
      (click)="inspect.emit(running()[0]?.agentId ?? agents()[0].agentId)"
    >
      <ng-icon name="lucideBot" size="15" [class.text-primary]="running().length > 0" />
      <span [class.font-semibold]="running().length > 0">Agents</span>
      <span class="ml-auto text-muted-foreground">
        @if (running().length) {
          {{ running().length }} active
        }
        @if (finished().length) {
          {{ running().length ? ' · ' : '' }}{{ finished().length }} finished
        }
        @if (attention()) {
          <span class="text-warning"> · {{ attention() }} need attention</span>
        }
      </span>
      <ng-icon name="lucideArrowUpRight" size="14" />
    </button>
    @if (running().length) {
      <div class="flex flex-wrap gap-1.5 border-t border-border/70 px-2 py-1.5">
        @for (agent of featured(); track agent.agentId) {
          <button
            z-button
            zType="ghost"
            zSize="sm"
            type="button"
            class="h-auto min-w-0 gap-2 rounded-lg px-2 py-1"
            [attr.aria-label]="'Inspect ' + agentLabel(agent)"
            (click)="inspect.emit(agent.agentId)"
          >
            <cw-subagent-identity
              class="max-w-48 text-xs"
              [label]="agentLabel(agent)"
              [nickname]="agent.displayName"
            />
            <cw-subagent-status [agent]="agent" />
          </button>
        }
        @if (running().length > featured().length) {
          <button
            z-button
            zType="ghost"
            zSize="sm"
            type="button"
            class="h-auto px-2 py-1 text-xs text-muted-foreground"
            (click)="inspect.emit(running()[0].agentId)"
          >
            +{{ running().length - featured().length }} active
          </button>
        }
      </div>
    }
  </section>
}
