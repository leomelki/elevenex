@let data = mention();
<article
  class="agent-mention-card grid items-start gap-2 rounded-lg border border-primary/20 bg-background/75 p-2"
  [class]="removeLabel() ? 'grid-cols-[auto_minmax(0,1fr)_auto]' : 'grid-cols-[auto_minmax(0,1fr)]'"
>
  <span
    class="inline-flex size-6 items-center justify-center rounded-md border border-border bg-background text-primary"
    aria-hidden="true"
  >
    <ng-icon [name]="data.icon" size="14" />
  </span>
  <div class="flex min-w-0 flex-col gap-0.5">
    <div class="flex min-w-0 items-center gap-2">
      <span
        class="inline-flex min-w-0 flex-1 items-baseline overflow-hidden whitespace-nowrap text-xs"
        [class.font-mono]="data.icon === 'lucideFileCode'"
        [title]="data.dirname ? data.dirname + '/' + data.title : data.title"
      >
        @if (data.dirname) {
          <span
            class="agent-mention__dir min-w-0 flex-1 truncate text-left font-medium text-muted-foreground [direction:rtl] [unicode-bidi:isolate]"
            >{{ data.dirname }}</span
          >
          <span class="shrink-0 px-px text-muted-foreground" aria-hidden="true">/</span>
        }
        <strong class="agent-mention__name max-w-full truncate font-extrabold text-foreground">{{
          data.title
        }}</strong>
      </span>
      <span
        class="shrink-0 rounded-full bg-muted px-1.5 py-0.5 font-mono text-[10px] font-bold text-muted-foreground"
        >{{ data.lineLabel }}</span
      >
    </div>
    <p class="m-0 truncate font-mono text-xs leading-snug text-foreground">{{ data.preview }}</p>
    <span class="text-[11px] leading-tight text-muted-foreground">{{ data.detail }}</span>
  </div>
  @if (removeLabel(); as label) {
    <button
      type="button"
      z-button
      zType="ghost"
      zSize="icon-xs"
      class="size-5 text-muted-foreground"
      [title]="label"
      [attr.aria-label]="label"
      (click)="remove.emit()"
    >
      <ng-icon name="lucideX" size="12" />
    </button>
  }
</article>
