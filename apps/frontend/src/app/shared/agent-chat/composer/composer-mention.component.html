<article
  class="grid grid-cols-[auto_minmax(0,1fr)_auto] items-start gap-2 rounded-lg border border-primary/20 bg-primary/5 p-2"
>
  <span
    class="inline-flex size-6 items-center justify-center rounded-md border border-border bg-background text-primary"
    aria-hidden="true"
  >
    <ng-icon [name]="icon()" size="14" />
  </span>
  <div class="flex min-w-0 flex-col gap-0.5">
    <div class="flex min-w-0 items-center gap-2">
      <span
        class="inline-flex min-w-0 flex-1 items-baseline overflow-hidden whitespace-nowrap text-xs"
        [class.font-mono]="icon() === 'lucideFileCode'"
        [title]="dirname() ? dirname() + '/' + title() : title()"
      >
        @if (dirname()) {
          <span
            class="cw-comp__mention-dir min-w-0 flex-1 truncate text-left font-medium text-muted-foreground [direction:rtl] [unicode-bidi:isolate]"
            >{{ dirname() }}</span
          >
          <span class="shrink-0 px-px text-muted-foreground" aria-hidden="true">/</span>
        }
        <strong class="cw-comp__mention-name max-w-full truncate font-extrabold text-foreground">{{
          title()
        }}</strong>
      </span>
      <span
        class="shrink-0 rounded-full bg-muted px-1.5 py-0.5 font-mono text-[10px] font-bold text-muted-foreground"
        >{{ lineLabel() }}</span
      >
    </div>
    <p class="m-0 truncate font-mono text-xs leading-snug text-foreground">{{ preview() }}</p>
    <span class="text-[11px] leading-tight text-muted-foreground">{{ detail() }}</span>
  </div>
  <button
    type="button"
    z-button
    zType="ghost"
    zSize="icon-xs"
    class="size-5 text-muted-foreground"
    [title]="removeLabel()"
    [attr.aria-label]="removeLabel()"
    (click)="remove.emit()"
  >
    <ng-icon name="lucideX" size="12" />
  </button>
</article>
