<section class="assignment" aria-label="Assignment">
  <header>
    <strong>Assignment</strong>
    <button exButton variant="ghost" size="sm" type="button" [disabled]="controlsDisabled()" (click)="link($event)">
      <ex-agent-mark [harness]="sender().session.selection?.provider" mark="A" />
      <span>From {{ title() }}</span>
    </button>
    @if (time()) { <time>{{ time() }}</time> }
  </header>
  @if (long() && !open()) { <p class="preview">{{ text() }}</p> }
  <ex-fold [open]="open()"><div class="brief" [id]="contentId"><ng-content /></div></ex-fold>
  @if (long()) {
    <div class="action">
      <button exButton variant="ghost" size="sm" type="button"
        [attr.aria-expanded]="open()" [attr.aria-controls]="contentId" (click)="open.set(!open())">
        {{ open() ? 'Show less' : 'Show the whole brief' }}
        <ex-icon [name]="open() ? 'chevron-up' : 'chevron-down'" [size]="12" />
      </button>
    </div>
  }
</section>
