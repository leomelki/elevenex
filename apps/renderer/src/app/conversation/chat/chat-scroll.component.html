<div
  #viewport
  class="viewport"
  tabindex="-1"
  role="region"
  aria-label="Conversation"
  (scroll)="onScroll()"
>
  <div #content class="content"><ng-content /></div>
</div>
@if (pin(); as pin) {
  <aside class="reminder" aria-label="Message reminder">
    <div class="reminder-top">
      <strong>You asked</strong
      ><button type="button" (click)="hideReminder()">Hide</button>
    </div>
    <button type="button" class="prompt" (click)="scrollToMessage(pin.id)">
      {{ pin.text }}</button
    ><button type="button" class="back" (click)="scrollToMessage(pin.id)">
      <ex-icon name="arrow-up" [size]="12" />Back to your message
    </button>
  </aside>
}
<div
  class="return"
  [class.visible]="!atEnd()"
  [attr.inert]="atEnd() ? '' : null"
  [attr.aria-hidden]="atEnd()"
>
  <button
    exButton
    variant="secondary"
    class="return-button"
    [attr.aria-label]="returnLabel()"
    [exTooltip]="returnLabel()"
    (click)="returnToEnd()"
  >
    <ex-icon name="arrow-down" [size]="16" />
    @if (unread()) {
      <span class="unread-dot" aria-hidden="true"></span>
    }
  </button>
</div>
