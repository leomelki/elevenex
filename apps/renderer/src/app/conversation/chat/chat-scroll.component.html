<div
  #viewport
  class="viewport"
  tabindex="0"
  role="region"
  aria-label="Conversation"
  (scroll)="onScroll()"
  (wheel)="onViewportInteraction()"
  (pointerdown)="onViewportInteraction()"
  (keydown)="onViewportKey($event)"
>
  <div #content class="content"><ng-content /></div>
</div>
@if (historyLoading() || historyError()) {
  <div class="history-status" role="status">
    @if (historyError()) {
      <span>{{ historyError() }}</span>
      <button type="button" (click)="retryHistory()">Retry</button>
    } @else {
      <span>Loading messages…</span>
    }
  </div>
}
@if (pin(); as pin) {
  <aside #reminderElement class="reminder" aria-label="Message reminder">
    <strong>You asked</strong>
    <button type="button" class="prompt" [attr.aria-label]="'Back to your message: ' + pin.text" (click)="scrollToMessage(pin.id)">
      <span>{{ pin.text }}</span>
      <ex-icon name="arrow-up" [size]="12" />
    </button>
    <button type="button" class="hide" aria-label="Hide message reminder" (click)="hideReminder()">Hide</button>
  </aside>
}
<div
  class="return"
  [class.visible]="!atEnd()"
  [attr.inert]="atEnd() ? '' : null"
  [attr.aria-hidden]="atEnd()"
>
  <button
    exButton
    variant="secondary"
    class="return-button"
    [attr.aria-label]="returnLabel()"
    [exTooltip]="returnLabel()"
    (click)="returnToEnd()"
  >
    <ex-icon name="arrow-down" [size]="16" />
    @if (unread()) {
      <span class="unread-dot" aria-hidden="true"></span>
    }
  </button>
</div>
