@if (logo(); as logo) {
  <svg [attr.viewBox]="logo.viewBox" fill="currentColor" fill-rule="evenodd" focusable="false">
    @if (gradient()) {
      <defs>
        <linearGradient [id]="gradientId" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" class="gradient-start" />
          <stop offset="45%" class="gradient-middle" />
          <stop offset="100%" class="gradient-end" />
        </linearGradient>
      </defs>
    }
    @for (path of logo.paths; track $index) {
      <path [attr.d]="path" [attr.fill]="gradient() ? 'url(#' + gradientId + ')' : null" />
    }
  </svg>
} @else {
  {{ mark() }}
}
