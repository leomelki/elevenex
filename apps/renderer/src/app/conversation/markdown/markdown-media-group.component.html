@if (comparison()) {
  <figure class="comparison">
    <div class="compare-images" [attr.aria-busy]="slots()[0]?.loading || slots()[1]?.loading">
      @for (slot of slots(); track slot.path; let first = $first) {
        @if (slot.image; as image) {
          <img [class.before]="first" [style.clip-path]="first && comparisonReady() ? 'inset(0 ' + (100 - wipe()) + '% 0 0)' : null"
            [src]="image.src" [alt]="image.caption" (error)="failed(image.src)" />
        } @else {
          <div class="compare-status" [class.before-status]="first" role="status">
            <span>{{ slot.caption }} · {{ slot.status }}</span>
            @if (!slot.loading) { <button type="button" class="previous" (click)="openUnavailable(slot)">Open {{ slot.caption || slot.path }}</button> }
          </div>
        }
      }
      @if (comparisonReady()) {
        <span class="wipe-line" [style.left.%]="wipe()"></span>
        <span class="before-label">Before</span><span class="after-label">After</span>
      }
    </div>
    <div class="compare-controls">
      <label>Compare before and after<input type="range" min="0" max="100" [value]="wipe()"
        [disabled]="!comparisonReady()" (input)="changeWipe($event)" aria-label="Before and after comparison" /></label>
      <ex-icon-button icon="expand" label="Enlarge comparison images" size="sm"
        [disabled]="!images().length" (pressed)="open(images()[0]!.path)" />
    </div>
  </figure>
} @else {
  <div class="images" [class.strip]="items().length > 2">
    @for (slot of slots(); track slot.path) {
      <figure>
        <div class="image-slot" [attr.aria-busy]="slot.loading">
          @if (slot.image; as image) {
            <button type="button" class="image" [attr.aria-label]="'Enlarge ' + (image.caption || image.path)" (click)="open(image.path)">
              <img [src]="image.src" [alt]="image.caption" loading="lazy" (error)="failed(image.src)" />
            </button>
          } @else if (slot.asset?.kind === 'video' || slot.asset?.kind === 'page') {
            <ex-markdown-media [path]="slot.path" [caption]="slot.caption" [showCaption]="false" [compact]="true" [asset]="slot.asset"
              (openFile)="openFile.emit($event)" (openPage)="openPage.emit($event)" />
          } @else {
            <div class="media-status" role="status">
              <span>{{ slot.status }}</span>
              @if (!slot.loading) { <button type="button" class="previous" (click)="openUnavailable(slot)">Open {{ slot.caption || slot.path }}</button> }
            </div>
          }
        </div>
        <figcaption>{{ slot.caption }}</figcaption>
      </figure>
    }
  </div>
}
<dialog tabindex="-1" #viewer [attr.aria-label]="current()?.caption || 'Image viewer'"
  (keydown)="onKey($event)" (close)="viewerOpen.set(false)">
  <div [cdkTrapFocus]="viewerOpen()" [cdkTrapFocusAutoCapture]="viewerOpen()">
    <header><span>{{ viewerIndex() + 1 }} of {{ images().length }}</span>
      <ex-icon-button icon="x" label="Close image viewer (Esc)" (pressed)="close()" />
    </header>
    @if (current(); as image) {
      <img [src]="image.src" [alt]="image.caption" [width]="image.w" [height]="image.h" />
      <footer>
        <button type="button" class="previous" aria-label="Previous image (Left arrow)" (click)="step(-1)">←</button>
        <span>{{ image.caption }}</span>
        <ex-icon-button icon="chevron-right" label="Next image (Right arrow)" (pressed)="step(1)" />
      </footer>
    }
  </div>
</dialog>
