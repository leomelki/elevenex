<button
  type="button"
  [disabled]="disabled()"
  [class.selected]="selected()"
  [class.custom]="custom()"
  [class.compact]="compact()"
  [attr.aria-pressed]="selected()"
  (click)="picked.emit()"
>
  <span class="top"
    ><span class="mark">
      @if (custom()) {
        <ex-icon name="plus" [size]="14" />
      } @else {
        {{ preset()?.mark }}
      }</span
    ><span class="grow"></span>
    @if (shortcut()) {
      <ex-kbd>{{ shortcut() }}</ex-kbd>
    }
    @if (selected()) {
      <span class="check"><ex-icon name="check" [size]="12" /></span>
    }</span
  ><span class="name"
    ><span class="label">{{
      custom()
        ? "Custom"
        : preset()?.preset || preset()?.modelLabel || preset()?.model
    }}</span>
    @if (!custom() && preset()?.default) {
      <span class="default">Default</span>
    }
    @if (preset()?.fast) {
      <ex-icon name="bolt" [size]="13" />
    }
  </span>
  @if (!compact()) {
    <span class="sub">{{
      custom()
        ? "Choose your own mix"
        : (preset()?.modelLabel || preset()?.model || "Provider default") +
          (thinking() ? " · " + thinking() : "")
    }}</span
    ><span class="harness">{{
      custom()
        ? "Adjust the agent"
        : preset()?.harnessLabel || preset()?.harness
    }}</span>
  }
</button>
