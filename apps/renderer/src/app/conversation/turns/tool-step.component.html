<section
  [class.running]="status() === 'running'"
  [class.failed]="status() === 'failed'"
>
  <button
    type="button"
    class="head"
    [disabled]="!hasContent()"
    [attr.aria-expanded]="hasContent() ? expanded() : null"
    (click)="toggled.set(!expanded())"
  >
    <ex-icon [name]="icon()" [size]="14" /><span class="verb">{{ verb() }}</span
    ><code [title]="detail()">{{ detail() }}</code
    ><span class="grow"></span><span class="meta">{{ meta() }}</span>
    @if (status() === "unknown") {
      <span role="img" aria-label="Completion unknown"
        ><ex-icon name="clock" [size]="14"
      /></span>
    } @else {
      <ex-status-glyph
        [status]="
          status() === 'failed'
            ? 'failed'
            : status() === 'running'
              ? 'running'
              : 'done'
        "
        [size]="14"
      />
    }
    @if (hasContent()) {
      <ex-icon
        [name]="expanded() ? 'chevron-down' : 'chevron-right'"
        [size]="12"
      />
    }
  </button>
  <ex-fold [open]="expanded() && hasContent()">
    @if (presentation(); as content) {
      <ex-tool-content [presentation]="content" [original]="output()" />
    } @else {
      <pre>{{ output() }}</pre>
    }
  </ex-fold>
</section>
