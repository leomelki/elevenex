<ex-fold #fold [open]="visible()">
  @if (painted(); as error) {
    <div class="frame">
      <div class="surface">
        <div class="error" role="status">
          <ex-icon name="clock" [size]="14" />
          @switch (error) {
            @case ('changed') { <span>This activity has changed.</span> }
            @case ('too-large') { <span>This activity is too large to open.</span> }
            @default { <span>Couldn’t load activity.</span> }
          }
        </div>
        @if (error !== 'too-large') {
          <button exButton variant="ghost" size="sm" type="button" (click)="retry()">
            {{ error === 'changed' ? 'Return to latest' : 'Retry' }}
          </button>
        }
      </div>
    </div>
  }
</ex-fold>
