<div
  class="mark"
  [title]="author() + (time() ? ' · ' + time() : '')"
  [attr.aria-label]="author()"
>
  {{ mark() }}
</div>
<div class="body">
  <div class="work-row">
    <button
      type="button"
      class="work"
      [attr.aria-expanded]="expanded()"
      (click)="toggled.set(!expanded())"
    >
      <span class="work-label" [class.failed]="status() === 'failed'">{{
        workLabel()
      }}</span>
      @if (status() === "live") {
        <span
          >{{ stepCount() }} {{ stepCount() === 1 ? "step" : "steps" }}</span
        >
      }
      @if (status() !== "live") {
        <span #factsRegion class="facts" [class.clipped]="factsClipped()">
          @for (fact of facts(); track fact.kind; let i = $index) {
            <span
              class="work-item fact"
              [class.failure]="fact.tone === 'danger'"
              [class.ok]="fact.tone === 'ok'"
              [style.--fact-index]="i"
            >
              <ex-icon [name]="fact.icon" [size]="12" />
              {{ fact.label }}
              @if (fact.diff; as diff) {
                <span class="diff">
                  @if (diff.add) {
                    <span class="add">+{{ diff.add }}</span>
                  }
                  @if (diff.del) {
                    <span class="del">−{{ diff.del }}</span>
                  }
                </span>
              }
            </span>
          }
        </span>
      }
      <span class="work-item chevron" [style.--fact-index]="facts().length">
        <ex-icon name="chevron-right" [size]="12" />
      </span>
    </button>
    @if (status() === "live" && stoppable()) {
      <button exButton variant="secondary" size="sm" (click)="stop.emit()">
        <ex-icon name="stop" [size]="12" />Stop
      </button>
    }
  </div>
  <ex-fold [open]="expanded()"
    ><ex-work-timeline
      [steps]="completedSteps()"
      [live]="status() === 'live'"
      [maxVisible]="maxVisible()"
  /></ex-fold>
  <ex-fold [open]="status() === 'live' && heldStep() !== null">
    @if (heldStep(); as step) {
      <ex-now-line [step]="step" [streaming]="activeStep()?.id === step.id" />
    }
  </ex-fold>
  <div class="answer" exAutoHeight>
    <div><ng-content /></div>
  </div>
  @if (status() === "failed" || status() === "stopped") {
    <div class="error" [class.failed]="status() === 'failed'">
      <span>{{
        error() ||
          (status() === "failed"
            ? "The agent could not finish."
            : "The agent stopped.")
      }}</span>
      @if (retryable()) {
        <button exButton variant="secondary" size="sm" (click)="retry.emit()">
          {{ status() === "failed" ? "Retry" : "Continue" }}
        </button>
      }
    </div>
  }
  <ex-fold [open]="status() !== 'live'"
    ><footer>
      <ex-outcome-bar
        [files]="files()"
        action=""
        (openFile)="openFile.emit($event)"
        (review)="review.emit()"
      /><ex-turn-acts [actions]="actions()" (action)="action.emit($event)" />
      @if (files().length) {
        <button exButton variant="secondary" size="sm" (click)="review.emit()">
          Review
        </button>
      }
    </footer></ex-fold
  >
</div>
