<section class="ready" aria-live="polite" [attr.aria-label]="title()">
  <header><span class="icon"><ex-icon [name]="icon()" [size]="18" /></span><div><h2>{{ title() }}</h2>@if (sub()) { <p>{{ sub() }}</p> }</div></header>
  <ex-step-list [steps]="steps()" />
  <footer><ng-content select="[readyActions]" />@if (note(); as note) { <span>{{ note }}</span> }</footer>
</section>
