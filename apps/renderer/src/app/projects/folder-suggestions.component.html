<div class="field" cdkOverlayOrigin #origin="cdkOverlayOrigin">
  <span class="field-in">
    <ex-icon [name]="url() ? 'link' : addedPaths().length ? 'plus' : 'folder'" [size]="14" />
    <input #field role="combobox" autocomplete="off" spellcheck="false"
      [attr.aria-label]="'Repository: a folder on ' + machine() + ' or a git URL'"
      aria-autocomplete="list" [attr.aria-expanded]="open()" [attr.aria-controls]="open() ? id : null"
      [attr.aria-activedescendant]="open() && items().length ? id + '-' + highlighted() : null"
      [attr.aria-busy]="loading()" [value]="query()" [disabled]="disabled()"
      [placeholder]="addedPaths().length ? 'Add another, or ↵ to go on' : 'A folder on ' + machine() + ', or a git URL'"
      (focus)="focused.set(true)" (blur)="focused.set(false)" (input)="setQuery($event)" (keydown)="keydown($event)" />
  </span>
</div>
<ng-template cdkConnectedOverlay [cdkConnectedOverlayOrigin]="origin" [cdkConnectedOverlayOpen]="open()"
  [cdkConnectedOverlayPositions]="positions" [cdkConnectedOverlayWidth]="origin.elementRef.nativeElement.offsetWidth + 2" (attach)="overlayAttached()" (detach)="stopFollowing()">
  <div class="drop" role="listbox" [id]="id" [attr.aria-label]="'Folders on ' + machine()">
    @for (item of items(); track item.path; let i = $index) {
      <button type="button" role="option" tabindex="-1" [id]="id + '-' + i"
        [attr.aria-selected]="i === highlighted()" [attr.aria-disabled]="addedPaths().includes(item.path)"
        [class.highlighted]="i === highlighted()" [class.added]="addedPaths().includes(item.path)"
        (mousedown)="$event.preventDefault()" (mouseenter)="highlighted.set(i)" (click)="pick(item)">
        <ex-icon [name]="item.clone ? 'link' : item.git ? 'repo' : 'folder'" [size]="14" />
        <span class="option-name">{{ item.name || name(item.path) }}</span>
        <span class="option-meta">{{ addedPaths().includes(item.path) ? 'Added' : item.clone ? 'clones into ~/code' : item.git || (item.dir ? '' : 'no git yet: Elevenex sets it up') }}</span>
        @if (addedPaths().includes(item.path)) { <ex-icon name="check" [size]="13" /> }
        @else if (item.dir && !item.git) { <ex-icon name="chevron-right" [size]="12" /> }
        @else if (i === highlighted()) { <ex-kbd>↵</ex-kbd> }
      </button>
    }
    @if (loading()) { <div class="feedback" role="status">Loading folders…</div> }
    @if (error()) { <div class="feedback" role="status">Folders could not be loaded.</div> }
  </div>
</ng-template>
