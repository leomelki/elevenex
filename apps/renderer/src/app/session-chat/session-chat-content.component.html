<ex-modal-layer
  [open]="open()"
  (closeRequested)="close()"
  (closed)="closed.emit()"
>
  <section
    role="dialog"
    aria-modal="true"
    aria-label="Full transcript content"
    [attr.inert]="open() ? null : ''"
  >
    <header>
      <h2>Transcript content</h2>
      <ex-icon-button icon="x" label="Close content" (pressed)="close()" />
    </header>
    <nav aria-label="Content">
      <button
        exButton
        variant="ghost"
        [attr.aria-pressed]="part() === 'text'"
        (click)="switchPart('text')"
      >
        Message / output</button
      ><button
        exButton
        variant="ghost"
        [attr.aria-pressed]="part() === 'input'"
        (click)="switchPart('input')"
      >
        Tool input
      </button>
    </nav>
    @if (busy()) {
      <p role="status">Loading content…</p>
    }
    @if (error()) {
      <p role="alert">{{ error() }}</p>
      <button exButton (click)="reload()">Retry</button>
    }
    @if (page(); as page) {
      <pre [attr.aria-busy]="busy()">{{
        page.text || "No content supplied."
      }}</pre>
      <footer>
        <button
          exButton
          variant="ghost"
          [disabled]="busy() || offset() === 0"
          (click)="offset.set(0)"
        >
          Start</button
        ><button
          exButton
          variant="ghost"
          [disabled]="busy() || !previousOffsets().length"
          (click)="previous()"
        >
          Previous</button
        ><span
          >{{ page.total ? page.offset + 1 : 0 }}–{{
            page.offset + page.text.length
          }}
          of {{ page.total }} characters</span
        ><button
          exButton
          variant="ghost"
          [disabled]="busy()"
          (click)="copyRequested.emit(page.text)"
        >
          Copy page</button
        ><button
          exButton
          variant="secondary"
          [disabled]="busy() || page.nextOffset === null"
          (click)="next()"
        >
          Next
        </button>
      </footer>
    }
  </section>
</ex-modal-layer>
