<span class="glyph" aria-hidden="true">
  <ex-icon [name]="view().icon" [size]="14" />
</span>
<div class="title-line">
  @if (view().event.agentId) {
    <button
      type="button"
      class="inspect"
      [attr.aria-label]="'Inspect ' + view().event.title"
      (click)="inspect()"
    >
      <span class="title">{{ view().event.title }}</span>
    </button>
  } @else {
    <span class="title">{{ view().event.title }}</span>
  }
</div>
@if (ago()) {
  <div class="end">
    <time class="time" [attr.datetime]="view().event.at">{{ ago() }}</time>
  </div>
}
@if (view().event.detail) {
  @if (view().output) {
    <div class="output above" exAutoHeight>
      <div>
        <pre
          [id]="outputId"
          [class.clamped]="view().long && !expanded()"
          >{{ view().event.detail }}</pre
        >
        @if (view().long) {
          <button
            type="button"
            class="more"
            [attr.aria-expanded]="expanded()"
            [attr.aria-controls]="outputId"
            (click)="expanded.set(!expanded())"
          >
            {{ expanded() ? "Show less" : "Show more" }}
          </button>
        }
      </div>
    </div>
  } @else {
    <p class="sub">
      <span class="detail">{{ view().event.detail }}</span>
    </p>
  }
}
