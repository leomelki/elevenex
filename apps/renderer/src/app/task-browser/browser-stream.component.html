<canvas #canvas aria-label="Streamed task browser page" tabindex="-1" (pointerdown)="pointer($event, 'down')" (pointerup)="pointer($event, 'up')" (pointermove)="pointer($event, 'move')" (wheel)="wheel($event)" (contextmenu)="$event.preventDefault()"></canvas>
<textarea #inputElement class="input-proxy" aria-label="Type in the streamed page" autocapitalize="off" autocomplete="off" spellcheck="false" (keydown)="key($event, 'down')" (keyup)="key($event, 'up')" (beforeinput)="beforeInput($event)" (input)="clearText()" (compositionstart)="compositionStart()" (compositionend)="compositionEnd($event)"></textarea>
@if (status()) { <div class="stream-status" [class.has-frame]="hasFrame()" role="status">{{ status() }}</div> }
