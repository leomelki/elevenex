<canvas [style.cursor]="surface().cursor ?? 'default'" #canvas aria-label="Streamed task browser page" tabindex="-1" (pointerdown)="humanInput.pointer($event, 'down')" (pointerup)="humanInput.pointer($event, 'up')" (pointermove)="humanInput.pointer($event, 'move')" (pointerleave)="humanInput.leavePointer()" (pointercancel)="humanInput.cancelPointer()" (lostpointercapture)="humanInput.cancelPointer()" (wheel)="humanInput.wheel($event)" (contextmenu)="$event.preventDefault()"></canvas>
<textarea #inputElement class="input-proxy" aria-label="Type in the streamed page" autocapitalize="off" autocomplete="off" spellcheck="false" (keydown)="humanInput.key($event, 'down')" (keyup)="humanInput.key($event, 'up')" (blur)="humanInput.releaseInput()" (beforeinput)="humanInput.beforeInput($event)" (input)="humanInput.clearText()" (compositionstart)="humanInput.compositionStart()" (compositionupdate)="humanInput.compositionUpdate($event)" (compositionend)="humanInput.compositionEnd($event)"></textarea>
@if (status()) { <div class="stream-status" [class.has-frame]="hasFrame()" role="status">{{ status() }}</div> }

@if (surface().pointerLocked && surface().interactive) {
  <div class="pointer-lock-control" role="status">@if (pointerLock.locked()) { <span>Pointer locked · Escape to release</span> } @else { <button exButton size="sm" (click)="startPointerLock()">Use pointer lock</button> }@if(pointerLock.error()){<span>{{ pointerLock.error() }}</span>}</div>
}
