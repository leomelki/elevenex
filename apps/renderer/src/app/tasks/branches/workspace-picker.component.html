<button class="trigger" type="button" [cdkMenuTriggerFor]="menu">
  <ex-icon name="workspace" [size]="14" />{{
    value() === 'auto' ? 'Automatic' : value()
  }}
  @if (value() === 'auto') {
    <span class="note">{{ note() }}</span>
  }
  <ex-icon name="chevron-down" [size]="13" />
</button>
<ng-template #menu
  ><div class="menu" cdkMenu aria-label="Workspace">
    <button
      type="button"
      cdkMenuItemRadio
      [cdkMenuItemChecked]="value() === 'auto'"
      (cdkMenuItemTriggered)="valueChange.emit('auto')"
    >
      <span class="stack grow"
        ><span>Automatic</span
        ><span class="muted"
          >Reuse a free workspace from the pool, or add one</span
        ></span
      >
      @if (value() === 'auto') {
        <ex-icon name="check" [size]="14" />
      }
    </button>
    <div class="separator"></div>
    <div class="label">
      <span>Pool</span
      ><span>{{ free().length }} free of {{ items().length }}</span>
    </div>
    @for (item of items(); track item.name) {
      <button
        type="button"
        cdkMenuItemRadio
        [cdkMenuItemChecked]="value() === item.name"
        [cdkMenuItemDisabled]="item.state === 'used'"
        [disabled]="item.state === 'used'"
        (cdkMenuItemTriggered)="valueChange.emit(item.name)"
      >
        <span class="dot" [class.used]="item.state === 'used'"></span
        ><span class="stack grow"
          ><span class="mono">{{ item.name }}</span
          ><span class="muted">{{
            item.state === 'used'
              ? 'In use · ' + item.task
              : 'Free' + (item.note ? ' · ' + item.note : '')
          }}</span></span
        >
        @if (value() === item.name) {
          <ex-icon name="check" [size]="14" />
        }
      </button>
    }
    <button
      type="button"
      cdkMenuItem
      (cdkMenuItemTriggered)="newWorkspace.emit()"
    >
      <ex-icon name="plus" [size]="14" />New workspace
    </button>
    <div class="separator"></div>
    <button
      type="button"
      cdkMenuItem
      (cdkMenuItemTriggered)="manageWorkspaces.emit()"
    >
      <ex-icon name="workspace" [size]="14" />Manage workspaces…
    </button>
  </div></ng-template
>
