<header>
  @if (parent(); as parent) {
    <button class="parent" type="button" [title]="'Open ' + parent.title" (click)="parentRequested.emit(parent)"><ex-icon name="subtask" [size]="12" />Sub-task of <b>{{ parent.title }}</b>@if (parent.branch) { <span class="mono">{{ parent.branch }}</span> }</button>
  }
  <div class="row">
    <div class="heading">
      @if (project(); as mark) {
        <ex-project-mark
          [name]="mark.name"
          [logo]="mark.logo"
          [initials]="mark.initials"
          [emoji]="mark.emoji"
          [icon]="mark.icon"
          [hue]="mark.hue ?? 'steel'"
          [size]="20"
          [decorative]="true"
        />
      }
      <h1>{{ title() }}</h1>
      @if (!closed()) { <ex-task-stage
        [stage]="stage()"
        [disabled]="disabled()"
        (stageChange)="stageChange.emit($event)"
      /> }
    </div>
    <span class="grow"></span>
    @if (!closed()) {
      <button type="button" class="close-task" [class.suggested]="closeSuggested()" [disabled]="disabled()" (click)="closeRequested.emit()">
        <ex-icon name="close-task" [size]="14" />Close task
      </button>
      <span class="separator" aria-hidden="true"></span>
    }
    <ex-icon-button
      icon="panel"
      label="Toggle side panel"
      [active]="panelOpen()"
      (pressed)="panelToggle.emit()"
    />
  </div>
  <div class="row">
    <div class="metadata">
      @if (repo(); as repo) { <ex-repo-tag [repo]="repo" size="md" /> }
      @if (branch(); as name) {
        <ex-branch-chip
          [name]="name"
          [compact]="true"
          [copied]="branchCopied()"
          [canRename]="canRenameBranch() && !disabled()"
          (renameRequested)="branchRename.emit($event)"
          (copyRequested)="branchCopy.emit($event)"
        />
      }
      @for (link of links(); track link.kind + link.label) {
        <ex-link-chip
          [kind]="link.kind"
          [label]="link.label"
          [state]="link.state"
          [href]="link.href"
          (activated)="linkActivated.emit(link)"
        />
      } @empty {
        <button class="link" type="button" [disabled]="!canLink() || disabled()" (click)="linkRequested.emit()">
          <ex-icon name="link" [size]="12" />Link PR or ticket
        </button>
      }
      @if (meta()) {
        <span class="meta">{{ meta() }}</span>
      }
    </div>
    <span class="grow"></span>
    @if (git(); as state) {
      <ex-git-bar
        [files]="state.files ?? 0"
        [add]="state.add ?? 0"
        [del]="state.del ?? 0"
        [ahead]="state.ahead ?? 0"
        [busy]="state.busy"
        [busyLabel]="state.busyLabel"
        [mergeInto]="state.mergeInto"
        [job]="state.job"
        [compact]="true"
        [allowedActions]="gitAllowedActions()"
        [quietLabel]="gitQuietLabel()"
        (action)="gitAction.emit($event)"
        (jobSessionRequested)="gitJobSessionRequested.emit($event)"
        (jobCancelled)="gitJobCancelled.emit($event)"
        (changesRequested)="changesRequested.emit()"
      ><div gitPanel><ng-content select="[gitPanel]" /></div></ex-git-bar>
    }
  </div>
</header>
