<button
  class="stage"
  type="button"
  [cdkMenuTriggerFor]="menu"
  aria-label="Change task stage"
>
  <ex-stage-glyph [stage]="stage()" [size]="12" />{{ labels[stage()]
  }}<ex-icon name="chevron-down" [size]="12" />
</button>
<ng-template #menu
  ><div class="menu" cdkMenu aria-label="Task stage">
    @for (item of stages; track item) {
      <button
        type="button"
        cdkMenuItemRadio
        [cdkMenuItemChecked]="stage() === item"
        (cdkMenuItemTriggered)="stageChange.emit(item)"
      >
        <ex-stage-glyph [stage]="item" /><span class="grow">{{
          labels[item]
        }}</span>
        @if (stage() === item) {
          <ex-icon name="check" [size]="14" />
        }
      </button>
    }</div
></ng-template>
