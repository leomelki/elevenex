<button
  class="stage"
  type="button"
  [disabled]="disabled()"
  [cdkMenuTriggerFor]="menu"
  [class.glyph-only]="glyphOnly()"
  [attr.aria-label]="glyphOnly() ? 'Change task stage: ' + labels[stage()] : 'Change task stage'"
  [exTooltip]="glyphOnly() ? 'Task stage: ' + labels[stage()] : ''"
  tooltipSide="bottom"
>
  <ex-stage-glyph [stage]="stage()" [size]="glyphOnly() ? 16 : 12" />
  @if (!glyphOnly()) {
    {{ labels[stage()] }}<ex-icon name="chevron-down" [size]="12" />
  }
</button>
<ng-template #menu
  ><ex-dropdown-menu label="Task stage">
    @for (item of stages; track item) {
      <button
        type="button"
        exDropdownRadio
        [checked]="stage() === item"
        (triggered)="stageChange.emit(item)"
      >
        <ex-stage-glyph [stage]="item" /><span class="grow">{{
          labels[item]
        }}</span>
      </button>
    }</ex-dropdown-menu
></ng-template>
