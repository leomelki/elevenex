<div [attr.data-session-id]="session().id" class="row" [class.has-archive]="!session().local && (allowArchive() || allowRestore())" [class.confirming]="confirming()">
<button
  class="select"
  type="button"
  [draggable]="!confirming() && !session().local"
  [class.dragging]="dragging()"
  [class.emphasis]="emphasis()"
  [class.receded]="receded()"
  [attr.aria-description]="session().local ? 'Local draft. Session creation is not yet confirmed.' : 'Drag onto another session to move under it, or into a message to mention it. Use Move session for keyboard moves.'"
  (dragstart)="startDrag($event)"
  (dragend)="dragging.set(false)"
  [exTooltip]="tooltip()"
  [class.attention]="session().status === 'attention' && !selected()"
  [class.failed]="session().status === 'failed' && !selected()"
  [class.with-context]="!!context()"
  [class.done]="session().status === 'done'"
  [class.fresh]="session().fresh"
  [class.muted]="muted() && !selected() && session().status !== 'attention' && session().status !== 'failed'"
  [attr.aria-current]="selected() ? 'true' : null"
  [style.padding-left.px]="8 + depth() * 16"
  (click)="activated.emit(session().id)"
>
  @if (archived()) { <ex-icon name="archive" [size]="14" /> } @else { <ex-status-glyph [status]="session().status" [size]="14" [exTooltip]="session().status === 'review' ? 'New reply · open chat to view' : ''" /> }
  @if (session().kind === 'delegated') {
    <ex-agent-mark class="kind" [harness]="session().agentSelection?.provider" mark="A" />
  } @else if (kindIcon(); as icon) {
    <span
      class="kind"
      [class.auto]="session().kind === 'auto'"
      [title]="
        session().kind === 'fork'
          ? 'Fork'
          : session().kind === 'auto'
            ? 'Started by Elevenex for a git job'
            : 'Side chat'
      "
      ><ex-icon [name]="icon" [size]="13"
    /></span>
  }
  <span class="label">
    <span class="title">{{ session().title }}</span>
    @if (context(); as context) {
      <span class="context" [title]="context">{{ context }}</span>
    }
  </span>
  @if (session().commands; as commands) {
    <span class="commands" role="img" [attr.aria-label]="commandsLabel()" [exTooltip]="commandsLabel()">
      <ex-icon name="terminal" [size]="12" />
      @if (commands > 1) { <span>{{ commands }}</span> }
    </span>
  }
  @if (!context()) {
    @if (session().diff; as diff) {
      @if (diff.add || diff.del) {
        <span
          class="diff"
          [attr.aria-label]="
            diff.add + ' lines added, ' + diff.del + ' removed'
          "
        >
          @if (diff.add) {
            <span class="add">+<ex-ticker [value]="diff.add" /></span>
          }
          @if (diff.del) {
            <span class="del">−<ex-ticker [value]="diff.del" /></span>
          }
        </span>
      }
    } @else if (session().meta) {
      <span class="meta">{{ session().meta }}</span>
    }
  }
  @if (session().unread) {
    <span class="unread" aria-label="Unread"></span>
  }
</button>

@if (allowArchive() && !archived() && !session().local) {
  <button class="archive" type="button"
    [attr.aria-label]="confirming() ? archiveLabel() + ' ' + session().title + ', press again to confirm' : (session().canDelete ? 'Delete ' : 'Archive ') + session().title"
    [exTooltip]="confirming() ? '' : session().canDelete ? 'Delete session' : 'Archive session'"
    (click)="archive($event)" (blur)="cancelArchive()" (keydown.escape)="cancelArchive($event)">
    <span class="archive-icon"><ex-icon [name]="session().canDelete ? 'trash' : 'archive'" [size]="14" /></span>
    <span class="archive-label" aria-hidden="true"><span>{{ archiveLabel() }}</span></span>
  </button>
}
@if (archived() && allowRestore()) {
  <button class="archive restore" type="button" [attr.aria-label]="'Restore ' + session().title" exTooltip="Restore session" (click)="restoreRequested.emit(session())">
    <span class="archive-icon"><ex-icon name="back" [size]="14" /></span>
  </button>
}
</div>
