<nav aria-label="Tasks" [exFlip]="rows()">
  @for (row of rows(); track row.key) {
    @if (row.kind === 'stage') {
      <ex-fold [open]="row.visible"
        ><h3>
          {{ labels[row.stage] }}<span>{{ row.count }}</span>
        </h3></ex-fold
      >
    } @else {
      <ex-fold [attr.data-flip]="row.key" [open]="row.visible"
        ><ex-task-group
          [task]="row.task"
          [selected]="selected()"
          [filter]="filter()"
          [showProject]="showProjects()"
          (selectSession)="
            selectSession.emit({ taskId: row.task.id, sessionId: $event })
          "
          (addSession)="addSession.emit($event)"
      /></ex-fold>
    }
  }
  @if (!hasVisible()) {
    <p class="empty">
      {{
        filter()
          ? 'No sessions match this filter.'
          : 'Your tasks will appear here.'
      }}
    </p>
  }
  @if (closedCount()) {
    <button class="closed" type="button" (click)="closedRequested.emit()">
      Closed<span>{{ closedCount() }}</span>
    </button>
  }
</nav>
