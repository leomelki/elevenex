<section class="review" [class.wide]="wide()" aria-label="Changes review" tabindex="0" (keydown)="keydown($event)">
  <div class="toolbar"><button class="jump" type="button" cdkOverlayOrigin #filesOrigin="cdkOverlayOrigin" [attr.aria-expanded]="listOpen()" aria-haspopup="dialog" (click)="listOpen.set(!listOpen())"><ex-icon name="changes" [size]="14" /><span>{{ current() ? names(current()!.path) : 'Changed files' }}</span><small>{{ files().length ? selectedIndex() + 1 : 0 }} of {{ files().length }}</small><ex-icon name="chevron-down" [size]="12" /></button>
    <ex-icon-button icon="chevron-up" label="Previous file (⌥↑)" size="sm" [disabled]="selectedIndex() === 0" (pressed)="step(-1)" /><ex-icon-button icon="chevron-down" label="Next file (⌥↓)" size="sm" [disabled]="selectedIndex() >= files().length - 1" (pressed)="step(1)" />
    <span class="viewed-count" [class.complete]="files().length && viewedCount() === files().length" role="status">{{ viewedCount() }}/{{ files().length }} viewed</span>
    <div class="modes" role="group" aria-label="Review mode"><button type="button" [attr.aria-pressed]="mode() === 'changes'" (click)="setMode('changes')">Changes</button><button type="button" [attr.aria-pressed]="mode() === 'full'" (click)="setMode('full')">Full files</button></div><ex-icon-button icon="wrap" label="Wrap lines" size="sm" [active]="wrap()" (pressed)="toggleWrap()" /><ex-icon-button [icon]="wide() ? 'shrink' : 'expand'" [label]="wide() ? 'Leave wider review (⇧⌘R)' : 'Wider review (⇧⌘R)'" size="sm" (pressed)="wideChange.emit(!wide())" /><ng-content select="[reviewToolbarEnd]" />
  </div>
  <div class="main"><aside [attr.inert]="!wide() ? '' : null" [attr.aria-hidden]="!wide() ? 'true' : null"><ex-change-list [items]="files()" [active]="current()?.id" (selected)="goTo($event)" /></aside><div #scroller class="scroller" (scroll)="scrolled()">
    @if (files().length > 12) { <div class="pages"><button exButton variant="ghost" size="sm" [disabled]="pageStart() === 0" (click)="setPage(-1)">Previous files</button><span>{{ pageStart() + 1 }}–{{ pageStart() + visibleFiles().length }} of {{ files().length }}</span><button exButton variant="ghost" size="sm" [disabled]="pageStart() + 12 >= files().length" (click)="setPage(1)">Next files</button></div> }
    <div class="stream">@for (file of visibleFiles(); track file.id) { <div #fileCard [attr.data-file-id]="file.id"><ex-diff-file [file]="file" [content]="contentMap().get(file.id)" [mode]="mode()" [wide]="wide()" [wrap]="wrap()" [commentsEnabled]="commentsEnabled()" [largeAt]="largeAt()" (viewedChange)="viewFile($event)" (fileRequested)="fileRequested.emit($event)" (contextRequested)="requestContext($event)" (commented)="commented.emit($event)" (openRequested)="openFileRequested.emit($event)" /></div> }</div>
    @if (!files().length) { <div class="empty"><ex-icon name="changes" [size]="24" /><p>No changes to review</p></div> }
  </div></div>
</section>
<ng-template cdkConnectedOverlay [cdkConnectedOverlayOrigin]="filesOrigin" [cdkConnectedOverlayOpen]="listOpen()" [cdkConnectedOverlayHasBackdrop]="true" cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop" (backdropClick)="listOpen.set(false)" (overlayKeydown)="$event.key === 'Escape' && listOpen.set(false)">
  <div class="file-menu" role="dialog" aria-label="Jump to a changed file" cdkTrapFocus [cdkTrapFocusAutoCapture]="true"><h3>Changed files <small>{{ files().length }}</small></h3><ex-change-list [items]="files()" [active]="current()?.id" (selected)="goTo($event)" /></div>
</ng-template>
